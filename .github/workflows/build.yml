name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q BaroGuard.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: BaroGuard
        run: |
          set +e
          gradle assembleDebug --stacktrace --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$( (grep -E '^e: ' build.log; grep -A10 'What went wrong' build.log) | head -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::error title=Gradle build failed::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: BaroGuard-debug-apk
          path: BaroGuard/app/build/outputs/apk/debug/*.apk
