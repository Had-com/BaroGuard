name: Build APK and AAB
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q BaroGuard.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Prepare signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KSP" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KA" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KP" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret set - signing with the public fallback key"
          fi
      - name: Build signed APK and AAB
        working-directory: BaroGuard
        run: |
          set +e
          gradle assembleDirectRelease bundlePlayRelease -PversionCode=${{ github.run_number }} --stacktrace --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$( (grep -E '^e: ' build.log; grep -A10 'What went wrong' build.log) | head -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::error title=Gradle build failed::$msg"
          fi
          exit $code
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp BaroGuard/app/build/outputs/apk/direct/release/app-direct-release.apk BaroGuard.apk
          cp BaroGuard/app/build/outputs/bundle/playRelease/app-play-release.aab BaroGuard.aab
          if [ -f BaroGuard/RELEASE_NOTES.md ]; then NOTES=BaroGuard/RELEASE_NOTES.md; else echo "Automated build" > notes.md; NOTES=notes.md; fi
          gh release create "v1.0.${{ github.run_number }}" BaroGuard.apk BaroGuard.aab --repo "${{ github.repository }}" --title "BaroGuard 1.0.${{ github.run_number }}" --notes-file "$NOTES" --latest
