name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q BaroGuard.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
        working-directory: BaroGuard
      - uses: actions/upload-artifact@v4
        with:
          name: BaroGuard-debug-apk
          path: BaroGuard/app/build/outputs/apk/debug/*.apk
