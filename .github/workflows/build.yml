name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q BaroGuard.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build release APK
        working-directory: BaroGuard
        run: |
          set +e
          gradle assembleRelease -PversionCode=${{ github.run_number }} --stacktrace --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$( (grep -E '^e: ' build.log; grep -A10 'What went wrong' build.log) | head -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::error title=Gradle build failed::$msg"
          fi
          exit $code
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp BaroGuard/app/build/outputs/apk/release/app-release.apk BaroGuard.apk
          gh release create "v1.0.${{ github.run_number }}" BaroGuard.apk --repo "${{ github.repository }}" --title "BaroGuard 1.0.${{ github.run_number }}" --notes "Automated build" --latest
